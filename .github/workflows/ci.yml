name: CI

# Runs the tests on every push and pull request. It never touches AWS, except:
# on main, when the repository variable AUTO_DEPLOY is "true" and the push
# changed something the backend depends on, the last job hands over to
# deploy.yml. With AUTO_DEPLOY "false" (or unset) that job is always skipped.
# Switch: gh variable set AUTO_DEPLOY --body true   (or false)
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older test run on a branch; never interrupt main,
  # whose run may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # Did this push to main touch the backend?
  changes:
    name: Detect backend changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    env:
      # Anything that ends up in the backend image or the production schema.
      BACKEND_PATHS: '^(backend/|alembic/|alembic\.ini$|database/|Dockerfile\.backend$)'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push has no "before" commit: treat it as a backend change.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE "$BACKEND_PATHS"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  auto-deploy:
    name: Auto-deploy (AUTO_DEPLOY=true only)
    needs: [tests, changes]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
