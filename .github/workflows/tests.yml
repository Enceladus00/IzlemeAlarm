name: Tests

# Reusable: called by ci.yml (every push / pull request) and by deploy.yml
# (manual deploys). Has no trigger of its own.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: izleme_alarm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway database on localhost, so the integration tests run too.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/izleme_alarm_ci
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # same as Dockerfile.backend
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrate the empty CI database
        run: alembic upgrade head
      - run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # same as Dockerfile.frontend-v2
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npx vitest run
